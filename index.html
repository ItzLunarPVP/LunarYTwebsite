<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ItzLunar | Official Gaming Portfolio</title>
    <style>
        :root {
            --bg-color: #05060b;
            --surface-color: #0c0e17;
            --card-bg: rgba(18, 22, 38, 0.5);
            --border-color: rgba(255, 255, 255, 0.05);
            --accent-lunar: #00f0ff; /* Cosmic Cyan Glow */
            --accent-glow: rgba(0, 240, 255, 0.15);
            --text-main: #ffffff;
            --text-muted: #868ca0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        html {
            scroll-behavior: smooth;
            background-color: var(--bg-color);
        }

        body {
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 1. Custom Lunar Loading Screen */
        #loading-gate {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #040509;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.6s;
        }

        .moon-spinner {
            position: relative;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #e1f5fe, #00b0ff, #000);
            box-shadow: 0 0 30px var(--accent-glow), inset -5px -5px 15px rgba(0,0,0,0.8);
            margin-bottom: 20px;
            animation: pulseMoon 2.5s ease-in-out infinite;
        }

        .orbit-ring {
            position: absolute;
            width: 110px;
            height: 110px;
            border: 1px dashed rgba(0, 240, 255, 0.3);
            border-radius: 50%;
            animation: spinOrbit 5s linear infinite;
        }

        @keyframes pulseMoon {
            0%, 100% { transform: scale(0.95); filter: drop-shadow(0 0 10px var(--accent-glow)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 25px rgba(0, 240, 255, 0.4)); }
        }

        @keyframes spinOrbit {
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--accent-lunar);
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        /* Ambient Space Background Canvas */
        .space-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 20%, rgba(0, 240, 255, 0.05) 0%, transparent 60%);
            pointer-events: none;
        }

        /* Sticky Navigation Bar */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(5, 6, 11, 0.7);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 900;
            text-decoration: none;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .logo span { color: var(--accent-lunar); }

        .nav-menu {
            display: flex;
            gap: 28px;
            list-style: none;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px 20px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }

        .nav-menu a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .nav-menu a:hover { color: var(--accent-lunar); }

        /* Main Sections Framework */
        section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 140px 24px 80px;
            min-height: 100vh;
        }

        /* Hero Layout Showcase */
        .hero-layout {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            align-items: center;
            gap: 60px;
        }

        .live-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.2);
            color: var(--accent-lunar);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent-lunar);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-lunar);
        }

        .hero-layout h1 {
            font-size: 4.8rem;
            font-weight: 900;
            line-height: 1.05;
            letter-spacing: -2px;
            margin-bottom: 16px;
        }

        .hero-layout h1 span { color: var(--accent-lunar); }

        .sub-tagline {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 24px;
        }

        .hero-desc {
            color: #b1b5c4;
            font-size: 1.15rem;
            line-height: 1.6;
            max-width: 520px;
            margin-bottom: 40px;
        }

        .cta-buttons {
            display: flex;
            gap: 16px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            padding: 14px 28px;
            border-radius: 30px;
            font-weight: 700;
            text-decoration: none;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .btn-glow {
            background: var(--accent-lunar);
            color: #06070d;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .btn-glow:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.5);
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(0, 240, 255, 0.3);
            transform: translateY(-3px);
        }

        /* Tracker Stats Block */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            max-width: 480px;
        }

        .stat-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .stat-box h3 { font-size: 1.7rem; font-weight: 800; }
        .stat-box p { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; margin-top: 4px; font-weight: 600; letter-spacing: 0.5px;}

        /* Animated 3D Floating Moon graphic */
        .graphic-side {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lunar-sphere {
            width: 100%;
            max-width: 320px;
            aspect-ratio: 1;
            background: radial-gradient(circle at 30% 30%, #e1f5fe, #00b0ff, #012d52, #000);
            border-radius: 50%;
            box-shadow: 
                inset 15px 15px 30px rgba(255,255,255,0.3),
                inset -20px -20px 40px rgba(0,0,0,0.9),
                0 0 60px rgba(0, 176, 255, 0.25);
            animation: lunarFloat 5s ease-in-out infinite;
        }

        @keyframes lunarFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(4deg); }
        }

        /* Multi-column Custom Video Grid Section */
        #videos-section {
            background-color: var(--surface-color);
            max-width: 100%;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        .section-header {
            margin-bottom: 48px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .section-header span {
            color: var(--accent-lunar);
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .section-header h2 { font-size: 2.5rem; font-weight: 800; margin-top: 4px; }

        .video-showcase-matrix {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .showcase-card {
            background: var(--bg-color);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            text-decoration: none;
