<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ItzLunar | Portfolio</title>
    <style>
        /* ==========================================================================
           CORE WEBSITE STYLING & ACCENTS
           ========================================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #03080f;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Navbar Layout Configuration */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 8%;
            width: 100%;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .logo span {
            color: #00f0ff;
        }

        .nav-links a {
            color: #70757d;
            text-decoration: none;
            margin-left: 20px;
            font-size: 15px;
            font-weight: 500;
            transition: color 0.3s;
            cursor: pointer;
        }

        .nav-links a.active, .nav-links a:hover {
            color: #ffffff;
        }

        /* Main Structural Containers */
        .main-wrapper {
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
            padding: 40px 8% 80px 8%;
        }

        /* Dynamic Section Switch Visibility Utilities */
        .portfolio-section {
            display: none;
            width: 100%;
        }

        .section-active {
            display: block !important;
        }

        .section-flex-active {
            display: flex !important;
        }

        /* Home View Grid Layout */
        .home-grid {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
            width: 100%;
        }

        .hero-content {
            flex: 1;
            max-width: 600px;
            text-align: left;
        }

        /* UI Badges & Highlights */
        .badge {
            display: inline-flex;
            align-items: center;
            background-color: rgba(0, 240, 255, 0.1);
            color: #00f0ff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        .badge .dot {
            width: 6px;
            height: 6px;
            background-color: #00f0ff;
            border-radius: 50%;
            margin-right: 8px;
        }

        h1 {
            font-size: 54px;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 15px;
        }

        .highlight {
            color: #00f0ff;
        }

        .sub-tags {
            color: #64748b;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .description {
            color: #94a3b8;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 35px;
            max-width: 480px;
        }

        /* Interactive Action Buttons */
        .cta-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 50px;
        }

        .btn {
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            padding: 14px 28px;
            border-radius: 30px;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .btn-primary {
            background-color: #00f0ff;
            color: #000000;
        }

        .btn-primary:hover {
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .btn-secondary {
            background-color: #0f172a;
            color: #ffffff;
            border: 1px solid #1e293b;
        }

        .btn-secondary:hover {
            background-color: #1e293b;
        }

        /* Channels Counters Panels */
        .stats-row {
            display: flex;
            gap: 20px;
        }

        .stat-card {
            background-color: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 12px;
            min-width: 110px;
            text-align: center;
        }

        .stat-card h2 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .stat-card p {
            font-size: 10px;
            color: #64748b;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* Decorative Glow Sphere Graphics Canvas */
        .hero-visual {
            flex: 1;
            display: flex;
            justify-content: center;
            position: relative;
        }

        .glowing-sphere {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #5ce1e6 0%, #0077b6 45%, #03045e 80%, #000000 100%);
            box-shadow: 
                0 0 60px rgba(0, 180, 216, 0.2),
                inset -10px -10px 40px rgba(0,0,0,0.8);
        }

        /* Sub-Pages Layout Styling */
        .page-content {
            width: 100%;
            text-align: center;
            padding-top: 20px;
        }

        .section-title {
            font-size: 44px;
            margin-bottom: 15px;
        }

        /* Videos Grid Panel Gallery Layout */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 40px;
            width: 100%;
        }

        .video-card {
            background-color: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 15px;
            text-align: left;
            transition: transform 0.2s;
        }

        .video-card:hover {
            transform: translateY(-5px);
        }

        .video-thumbnail {
            background-color: #0f172a;
            width: 100%;
            height: 160px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 12px;
        }

        /* Pop-up Overlay Configuration */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.modal-open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: #0a0f1d;
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 40px;
            border-radius: 16px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.1);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            color: #70757d;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #ffffff;
        }

        .modal-content h2 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #ffffff;
        }

        .modal-content p {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        /* Interactive Discord Invite Button */
        .discord-btn {
            display: inline-block;
            background-color: #5865F2;
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            padding: 14px 32px;
            border-radius: 30px;
            font-size: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.3);
        }

        .discord-btn:hover {
            background-color: #4752C4;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(88, 101, 242, 0.5);
        }

        /* Mobile Layout View Responsive Configuration */
        @media (max-width: 968px) {
            .home-grid {
                flex-direction: column-reverse;
                text-align: center;
                gap: 50px;
            }
            .hero-content {
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .cta-buttons, .stats-row {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- Navigation Header -->
    <header class="navbar">
        <div class="logo">Itz<span>Lunar</span></div>
        <nav class="nav-links">
            <a href="#home" class="nav-item active" onclick="switchSection('home', event)">Home</a>
            <a href="#videos" class="nav-item" onclick="switchSection('videos', event)">Videos</a>
            <a href="#about" class="nav-item" onclick="switchSection('about', event)">About</a>
