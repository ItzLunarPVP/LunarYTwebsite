<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ItzLunar | Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #03080f;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Navigation Header */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 8%;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .logo span {
            color: #00f0ff;
        }

        .nav-links a {
            color: #70757d;
            text-decoration: none;
            margin-left: 20px;
            font-size: 15px;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a.active, .nav-links a:hover {
            color: #ffffff;
        }

        /* Hero Section Container */
        .hero-container {
            display: flex;
            max-width: 1300px;
            margin: 0 auto;
            padding: 40px 8% 80px 8%;
            align-items: center;
            justify-content: space-between;
        }

        .hero-content {
            flex: 1;
            max-width: 600px;
        }

        /* Typography & Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            background-color: rgba(0, 240, 255, 0.1);
            color: #00f0ff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        .badge .dot {
            width: 6px;
            height: 6px;
            background-color: #00f0ff;
            border-radius: 50%;
            margin-right: 8px;
        }

        h1 {
            font-size: 54px;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 15px;
        }

        .highlight {
            color: #00f0ff;
        }

        .sub-tags {
            color: #64748b;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .description {
            color: #94a3b8;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 35px;
            max-width: 480px;
        }

        /* Action Buttons */
        .cta-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 50px;
        }

        .btn {
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            padding: 14px 28px;
            border-radius: 30px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: #00f0ff;
            color: #000000;
        }

        .btn-secondary {
            background-color: #0f172a;
            color: #ffffff;
            border: 1px solid #1e293b;
        }

        /* Statistics Row */
        .stats-row {
            display: flex;
            gap: 20px;
        }

        .stat-card {
            background-color: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 12px;
            min-width: 110px;
            text-align: center;
        }

        .stat-card h2 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .stat-card p {
            font-size: 10px;
            color: #64748b;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* Right Side: Glowing 3D Orb Art */
        .hero-visual {
            flex: 1;
            display: flex;
            justify-content: center;
            position: relative;
        }

        .glowing-sphere {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #5ce1e6 0%, #0077b6 45%, #03045e 80%, #000000 100%);
            box-shadow: 
                0 0 60px rgba(0, 180, 216, 0.2),
                inset -10px -10px 40px rgba(0,0,0,0.8);
        }

        /* Responsive Scaling for Tablets/Mobile */
        @media (max-width: 968px) {
            .hero-container {
                flex-direction: column-reverse;
                text-align: center;
                gap: 50px;
            }
            .hero-content {
                display: flex;
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>

    <!-- Navigation Header -->
    <header class="navbar">
        <div class="logo">Itz<span>Lunar</span></div>
        <nav class="nav-links">
            <a href="#" class="active">Home</a>
            <a href="#">Videos</a>
            <a href="#">About</a>
        </nav>
    </header>

    <!-- Hero Section Container -->
    <main class="hero-container">
        
        <!-- Left Side: Content Box -->
        <section class="hero-content">
            <div class="badge">
                <span class="dot"></span> OFFICIAL PORTFOLIO
            </div>
            
            <h1>Content Creator & <br><span class="highlight">Gamer</span></h1>
            
            <p class="sub-tags">GAMING &bull; MONTAGES &bull; STREAMS</p>
            
            <p class="description">
                Welcome to the official portal. Check out the latest video uploads, stream highlights, and channel stats below.
            </p>
            
            <div class="cta-buttons">
                <a href="#" class="btn btn-primary">Watch Videos</a>
                <a href="#" class="btn btn-secondary">YouTube Channel</a>
            </div>
            
            <!-- Statistics Row -->
            <div class="stats-row">
                <div class="stat-card">
                    <h2>10K+</h2>
                    <p>SUBSCRIBERS</p>
                </div>
                <div class="stat-card">
                    <h2>500+</h2>
                    <p>VIDEOS</p>
                </div>
                <div class="stat-card">
                    <h2>1M+</h2>
                    <p>VIEWS</p>
                </div>
            </div>
        </section>

        <!-- Right Side: Glowing 3D Orb Art -->
        <section class="hero-visual">
            <div class="glowing-sphere"></div>
        </section>

    </main>

</body>
</html>
