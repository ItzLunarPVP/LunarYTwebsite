<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ItzLunar | Portfolio</title>
    <style>
        /* ==========================================================================
           ORIGINAL LAYOUT STYLING (RESTORED & RIGIDLY VERIFIED)
           ========================================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #03080f;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Navbar Layer */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 8%;
            position: sticky;
            top: 0;
            background-color: rgba(3, 8, 15, 0.9);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .logo span {
            color: #00f0ff;
        }

        .nav-links a {
            color: #70757d;
            text-decoration: none;
            margin-left: 20px;
            font-size: 15px;
            font-weight: 500;
            transition: color 0.3s;
            cursor: pointer;
        }

        .nav-links a.active, .nav-links a:hover {
            color: #ffffff;
        }

        /* Hero Section Container */
        main.hero-container {
            display: flex;
            max-width: 1300px;
            margin: 0 auto;
            padding: 40px 8% 80px 8%;
            align-items: center;
            justify-content: space-between;
            min-height: calc(100vh - 90px);
        }

        .hero-content {
            flex: 1;
            max-width: 600px;
        }

        /* Typography & Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            background-color: rgba(0, 240, 255, 0.1);
            color: #00f0ff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        .badge .dot {
            width: 6px;
            height: 6px;
            background-color: #00f0ff;
            border-radius: 50%;
            margin-right: 8px;
        }

        h1 {
            font-size: 54px;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 15px;
        }

        .highlight {
            color: #00f0ff;
        }

        .sub-tags {
            color: #64748b;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .description {
            color: #94a3b8;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 35px;
            max-width: 480px;
        }

        /* Action Buttons with Animations */
        .cta-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 50px;
        }

        .btn {
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            padding: 14px 28px;
            border-radius: 30px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: inline-block;
        }

        .btn-primary {
            background-color: #00f0ff;
            color: #000000;
        }

        .btn-primary:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 240, 255, 0.4);
        }

        .btn-secondary {
            background-color: #0f172a;
            color: #ffffff;
            border: 1px solid #1e293b;
        }

        .btn-secondary:hover {
            background-color: #1e293b;
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        /* Statistics Row */
        .stats-row {
            display: flex;
            gap: 20px;
        }

        .stat-card {
            background-color: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 12px;
            min-width: 110px;
            text-align: center;
        }

        .stat-card h2 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .stat-card p {
            font-size: 10px;
            color: #64748b;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* Glowing 3D Orb */
        .hero-visual {
            flex: 1;
            display: flex;
            justify-content: center;
            position: relative;
        }

        .glowing-sphere {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #5ce1e6 0%, #0077b6 45%, #03045e 80%, #000000 100%);
            box-shadow: 
                0 0 60px rgba(0, 180, 216, 0.2),
                inset -10px -10px 40px rgba(0,0,0,0.8);
        }

        /* ==========================================================================
           VIDEOS GALLERY GRID LAYOUT STYLING
           ========================================================================== */
        .video-section {
            max-width: 1300px;
            margin: 0 auto;
            padding: 80px 8%;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .section-heading-container {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-title {
            font-size: 40px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            width: 100%;
        }

        .video-card {
            background-color: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .video-card:hover {
            transform: translateY(-8px);
            border-color: rgba(0, 240, 255, 0.2);
            box-shadow: 0 12px 24px rgba(0, 240, 255, 0.05);
        }

        .video-thumbnail-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background-color: #0f172a;
        }

        .video-thumbnail-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-info-box {
            padding: 20px;
        }

        .video-card-title {
            font-size: 16px;
            font-weight: 700;
            line-height: 1.4;
            color: #ffffff;
        }

        /* ==========================================================================
           CONTACT MODAL POPUP STYLING
           ========================================================================== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.modal-open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: #0a0f1d;
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 40px;
            border-radius: 16px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.1);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            color: #70757d;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #ffffff;
        }

        .modal-content h2 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #ffffff;
        }

        .modal-content p {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .discord-btn {
            display: inline-block;
            background-color: #5865F2;
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            padding: 14px 32px;
            border-radius: 30px;
            font-size: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.3);
        }

        .discord-btn:hover {
            background-color: #4752C4;
            transform: translateY(-2px);
        }

        /* Responsive Configuration */
        @media (max-width: 968px) {
            main.hero-container {
                flex-direction: column-reverse;
                text-align: center;
                gap: 50px;
            }
            .hero-content {
                display: flex;
                flex-direction: column;
