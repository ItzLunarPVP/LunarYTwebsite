<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ItzLunar | Official Gaming Portfolio</title>
    <style>
        :root {
            --bg-color: #05060b;
            --surface-color: #0c0e17;
            --card-bg: rgba(18, 22, 38, 0.5);
            --border-color: rgba(255, 255, 255, 0.05);
            --accent-lunar: #00f0ff; /* Cosmic Cyan Glow */
            --accent-glow: rgba(0, 240, 255, 0.15);
            --text-main: #ffffff;
            --text-muted: #868ca0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        html {
            scroll-behavior: smooth;
            background-color: var(--bg-color);
        }

        body {
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 20%, rgba(0, 240, 255, 0.05) 0%, transparent 60%);
        }

        /* Sticky Navigation Bar */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(5, 6, 11, 0.7);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 900;
            text-decoration: none;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .logo span { color: var(--accent-lunar); }

        .nav-menu {
            display: flex;
            gap: 28px;
            list-style: none;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px 20px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }

        .nav-menu a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .nav-menu a:hover { color: var(--accent-lunar); }

        /* Main Sections Framework */
        section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 140px 24px 80px;
            min-height: 100vh;
        }

        /* Hero Layout Showcase */
        .hero-layout {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            align-items: center;
            gap: 60px;
        }

        .live-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.2);
            color: var(--accent-lunar);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent-lunar);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-lunar);
        }

        .hero-layout h1 {
            font-size: 4.8rem;
            font-weight: 900;
            line-height: 1.05;
            letter-spacing: -2px;
            margin-bottom: 16px;
        }

        .hero-layout h1 span { color: var(--accent-lunar); }

        .sub-tagline {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 24px;
        }

        .hero-desc {
            color: #b1b5c4;
            font-size: 1.15rem;
            line-height: 1.6;
            max-width: 520px;
            margin-bottom: 40px;
        }

        .cta-buttons {
            display: flex;
            gap: 16px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            padding: 14px 28px;
            border-radius: 30px;
            font-weight: 700;
            text-decoration: none;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .btn-glow {
            background: var(--accent-lunar);
            color: #06070d;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .btn-glow:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.5);
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(0, 240, 255, 0.3);
            transform: translateY(-3px);
        }

        /* Tracker Stats Block */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            max-width: 480px;
        }

        .stat-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .stat-box h3 { font-size: 1.7rem; font-weight: 800; }
        .stat-box p { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; margin-top: 4px; font-weight: 600; letter-spacing: 0.5px;}

        /* Animated 3D Floating Moon graphic */
        .graphic-side {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lunar-sphere {
            width: 100%;
            max-width: 320px;
            aspect-ratio: 1;
            background: radial-gradient(circle at 30% 30%, #e1f5fe, #00b0ff, #012d52, #000);
            border-radius: 50%;
            box-shadow: 
                inset 15px 15px 30px rgba(255,255,255,0.3),
                inset -20px -20px 40px rgba(0,0,0,0.9),
                0 0 60px rgba(0, 176, 255, 0.25);
            animation: lunarFloat 5s ease-in-out infinite;
        }

        @keyframes lunarFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(4deg); }
        }

        /* Multi-column Custom Video Grid Section */
        #videos-section {
            background-color: var(--surface-color);
            max-width: 100%;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 100px 0;
        }

        .section-header {
            margin-bottom: 48px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
            padding: 0 24px;
        }

        .section-header span {
            color: var(--accent-lunar);
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .section-header h2 { font-size: 2.5rem; font-weight: 800; margin-top: 4px; }

        .video-showcase-matrix {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .showcase-card {
            background: var(--bg-color);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            text-decoration: none;
            color: inherit;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.3s;
        }

        .showcase-card:hover {
            transform: translateY(-6px);
            border-color: rgba(0, 240, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .thumb-box {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
        }

        .thumb-box img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-details { padding: 24px; }
        
        .video-title-label {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.4;
            height: 2.8em;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .metadata-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Footer Container */
        footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
        }

        @media (max-width: 960px) {
            .hero-layout { grid-template-columns: 1fr; text-align: center; }
            .hero-desc { margin: 0 auto 40px; }
            .cta-buttons { justify-content: center; }
            .stats-row { margin: 0 auto; }
            .nav-menu { display: none; }
            .hero-layout h1 { font-size: 3.4rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
